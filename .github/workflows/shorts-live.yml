name: Bolbill 24/7 Vertical Shorts Live

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Install FFmpeg and Curl
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl

      - name: Download and Merge All 10s Clips into One Master File
        run: |
          mkdir -p videos norm
          curl -sL "https://bolbill.in/short_live/playlist.php" -o urls.txt
          
          cd videos
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            curl -sLO "$url"
          done < ../urls.txt
          cd ..

          i=1
          for file in $(ls -v videos/*); do
            [ -f "$file" ] || continue
            out=$(printf "norm/%04d.ts" "$i")
            ffmpeg -hide_banner -loglevel error \
            -i "$file" -f lavfi -t 1 -i anullsrc=r=44100:cl=stereo \
            -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30[v]" \
            -map "[v]" -map "0:a?" -map "1:a" -shortest \
            -c:v libx264 -preset ultrafast -b:v 3500k -maxrate 3500k -bufsize 7000k \
            -pix_fmt yuv420p -g 60 \
            -c:a aac -ar 44100 -ac 2 -b:a 128k \
            -f mpegts "$out" || true
            i=$((i+1))
          done

          for f in norm/*.ts; do echo "file '$PWD/$f'" >> merge.txt; done
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i merge.txt -c copy master.mp4
          echo "Master file ready! Duration & Size:"
          ls -lh master.mp4

      - name: Stream Master File Seamlessly to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          while true; do
            ffmpeg -re -fflags +genpts -stream_loop -1 -i master.mp4 \
            -c copy -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
            sleep 2
          done
