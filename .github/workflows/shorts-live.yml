name: Bolbill 24/7 Vertical Shorts Live

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Install FFmpeg and Curl
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl

      - name: Fetch Playlist from bolbill.in
        run: |
          curl -sL "https://bolbill.in/short_live/playlist.php" -o urls.txt
          echo "Total videos found: $(wc -l < urls.txt)"
          cat urls.txt

      - name: Start 24/7 Bulletproof Vertical Live
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          mkfifo /tmp/live_pipe.ts

          ffmpeg -re -fflags +genpts+igndts -i /tmp/live_pipe.ts \
          -c:v libx264 -preset veryfast -b:v 3500k -maxrate 3500k -bufsize 7000k \
          -pix_fmt yuv420p -r 30 -g 60 \
          -c:a aac -b:a 128k -ar 44100 -ac 2 \
          -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY" &

          while true; do
            while IFS= read -r VIDEO_URL; do
              [ -z "$VIDEO_URL" ] && continue
              echo "Now Streaming: $VIDEO_URL"
              
              ffmpeg -hide_banner -loglevel error \
              -i "$VIDEO_URL" -f lavfi -t 1 -i anullsrc=r=44100:cl=stereo \
              -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30[v]" \
              -map "[v]" -map "0:a?" -map "1:a" -shortest \
              -c:v libx264 -preset ultrafast -crf 23 -pix_fmt yuv420p \
              -c:a aac -ar 44100 -ac 2 -b:a 128k \
              -f mpegts - > /tmp/live_pipe.ts || true
            done < urls.txt
          done
